<!doctype html>
<html>
  <head>
    <title>AlloIRL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  </head>
  <body>
    <div class="app-container">
      <div class="header-row">
        <div class="header-attendee">Attendee</div>
        <div class="header-timeline" id="timeline-header">
          <!-- Time labels will be inserted here by D3 -->
        </div>
        <div class="header-projects">
          PROJECT RANKING
          <div class="header-projects-arrow">↓</div>
        </div>
      </div>
      <div class="main-content">
        <div class="attendees-column">
          <!-- Attendees will go here -->
        </div>
        <div id="visualization" class="timeline-column">
          <!-- D3 visualization will go here -->
        </div>
        <div class="projects-column">
          <!-- Projects will be rendered here by D3 -->
        </div>
      </div>
      <div class="footer hidden">
        <img src="https://irl.allo.capital/allo.png" style="height: 30px; padding: 10px; padding-left: 20px;">
        <div class="footer-controls">
          <button id="reset-control" class="reset-control" aria-label="Reset to top">
            <svg viewBox="0 0 24 24">
              <path d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            </svg>
          </button>
          <button id="animation-control" class="animation-control" aria-label="Toggle animation">
            <svg id="pause-icon" viewBox="0 0 24 24">
              <rect x="6" y="4" width="4" height="16" />
              <rect x="14" y="4" width="4" height="16" />
            </svg>
            <svg id="play-icon" viewBox="0 0 24 24" style="display: none;">
              <path d="M8 5v14l11-7z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="script.js" type="module"></script>
  </body>
</html>
